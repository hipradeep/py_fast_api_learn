[project]
name = "py-fast-api-learn"
version = "1.0.0"
description = "Users, Orders and Inventory system built with FastAPI + SQLModel"
readme = "README.md"
requires-python = ">=3.11"

# Kept identical to requirements.txt on purpose. See the note at the bottom of
# this file about keeping the two in sync.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "sqlmodel==0.0.47",
    "SQLAlchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Linting, types, tests. Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because the flat layout here holds several top-level directories
# (app, scripts, tests, alembic) and setuptools auto-discovery refuses to guess.
# Only app and scripts ship: tests is excluded on purpose, and alembic is
# migration data reached via script_location in alembic.ini, not an importable
# module.
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated by `alembic revision --autogenerate`; never hand-formatted.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SQLModel and SQLAlchemy dynamic attributes defeat strict typing.
module = ["sqlmodel.*", "sqlalchemy.*"]
ignore_missing_imports = true

# Migrated from pytest.ini. pytest.ini takes precedence over this file, so it was
# deleted — keeping both means the ini silently wins and edits here do nothing.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------------------
# requirements.txt vs this file
#
# They currently hold identical pins, verified. Keep them that way, or pick one
# owner:
#
#   Option A  pyproject.toml declares ranges, requirements.txt stays the pinned
#             lockfile. Regenerate it after editing deps:
#               pip install pip-tools
#               pip-compile --output-file=requirements.txt pyproject.toml
#
#   Option B  drop requirements.txt and install with `pip install -e .[dev]`.
#             Fewer files, but you lose the exact-pin lockfile.
#
# Note: `pip install -r requirements.txt` does NOT read [project].dependencies,
# so neither file installs the other.
# ---------------------------------------------------------------------------